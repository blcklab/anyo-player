name: Production validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  package-node-matrix:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run check
      - run: npm run test:production

  browser-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser:matrix
        env:
          ANYO_PLAYER_REQUIRE_BROWSER_MATRIX: '1'
      - run: npm run test:memory
        env:
          ANYO_PLAYER_REQUIRE_MEMORY_PROFILE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-f-browser-memory
          path: validation-results/

  chromium-no-framework-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:track-f:browser
        env:
          ANYO_PLAYER_REQUIRE_TRACK_F_BROWSER: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-f-chromium-smoke
          path: validation-results/

  real-safari:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: sudo safaridriver --enable
      - run: npm run test:safari

  physical-evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run validation:track-f -- validation/track-f-stable-matrix.template.json
