<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anyo Player — Two Embedded Players</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #111827; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; padding: 1rem; }
    .world { min-height: 420px; position: relative; border: 1px solid #334155; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main><section id="world-a" class="world"></section><section id="world-b" class="world"></section></main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
