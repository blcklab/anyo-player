<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anyo Player Accessibility</title>
  <link rel="stylesheet" href="../../dist/styles.css" />
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; background: #0f1115; color: #fff; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; }
    #player { min-height: 0; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <header>
    <button id="motion" type="button">Toggle reduced motion</button>
    <button id="announce" type="button">Announce checkpoint</button>
    <output id="status" aria-live="polite"></output>
  </header>
  <main id="player"></main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
