<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anyo Player Media Controls</title>
  <link rel="stylesheet" href="../../dist/styles.css" />
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; background: #10131a; color: #fff; }
    header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; }
    #player { min-height: 0; }
    button, a { padding: 8px 12px; }
  </style>
</head>
<body>
  <header>
    <button id="mute" type="button">Toggle mute</button>
    <button id="shot" type="button">Capture screenshot</button>
    <a id="download" hidden>Download latest screenshot</a>
    <output id="status" aria-live="polite"></output>
  </header>
  <main id="player"></main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
