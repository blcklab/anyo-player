<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anyo Player session snapshots</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; font-family: system-ui, sans-serif; }
      body { display: grid; grid-template-rows: auto 1fr; background: #0f172a; color: white; }
      nav { display: flex; gap: .5rem; align-items: center; padding: .75rem; }
      button { padding: .55rem .85rem; }
      #status { margin-left: auto; opacity: .8; }
      #world { min-height: 0; }
    </style>
  </head>
  <body>
    <nav aria-label="Session controls">
      <button id="save" type="button">Save checkpoint</button>
      <button id="restore" type="button">Restore checkpoint</button>
      <button id="clear" type="button">Clear checkpoint</button>
      <span id="status" role="status" aria-live="polite"></span>
    </nav>
    <main id="world"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
