<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anyo Player Input Bindings and Gamepad</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #0d1016; }
      #world { width: 100%; height: 100%; }
      #controls {
        position: fixed; inset: 12px auto auto 12px; z-index: 20;
        display: grid; gap: 8px; width: min(340px, calc(100vw - 24px));
        padding: 12px; border: 1px solid rgba(255,255,255,.16); border-radius: 12px;
        background: rgba(10,12,18,.88); color: white; font: 14px/1.4 system-ui, sans-serif;
      }
      #controls div { display: flex; flex-wrap: wrap; gap: 8px; }
      button { padding: 7px 10px; }
      output { overflow-wrap: anywhere; color: #b9c2d0; }
    </style>
  </head>
  <body>
    <main id="world"></main>
    <aside id="controls" aria-label="Input binding controls">
      <strong>Unified input actions</strong>
      <span>WASD / arrows move, P pauses, E interacts. A standard gamepad is optional.</span>
      <div>
        <button id="alternate" type="button">Use IJKL layout</button>
        <button id="reset" type="button">Reset</button>
        <button id="save" type="button">Save</button>
        <button id="load" type="button">Load</button>
      </div>
      <output id="status" aria-live="polite">Loading…</output>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
