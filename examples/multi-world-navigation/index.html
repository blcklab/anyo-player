<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anyo Player multi-world navigation</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080b12; color: white; font-family: system-ui; }
    main { width: min(960px, calc(100% - 2rem)); }
    #world { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #111827; }
    nav { display: flex; gap: .75rem; padding: 1rem 0; }
    select, button { padding: .65rem .85rem; font: inherit; }
  </style>
</head>
<body>
  <main>
    <div id="world"></div>
    <nav aria-label="World navigation">
      <select id="destination">
        <option value="lobby">Lobby</option>
        <option value="gallery">Gallery</option>
        <option value="store">Store</option>
      </select>
      <button id="navigate" type="button">Navigate</button>
      <button id="cancel" type="button" disabled>Cancel preparation</button>
    </nav>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
